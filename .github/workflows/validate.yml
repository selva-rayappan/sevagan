name: Validate Codebase

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # REQUIRED for local actions
      - name: Checkout repository
        uses: actions/checkout@v4

      # Run your local composite action
      - name: Run DevSecOps Validator
        uses: ./.github/actions/devsecops-validator
