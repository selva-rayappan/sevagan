name: Validate Codebase

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: DEBUG – list .github folder
        run: |
          echo "PWD:"
          pwd
          echo "Listing .github:"
          ls -R .github || true

      - name: Run DevSecOps Validator
        uses: ./.github/actions/devsecops-validator/action.yml
